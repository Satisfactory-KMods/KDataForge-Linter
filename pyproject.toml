[project]
name = "kdataforge-linter"
version = "0.1.0"
description = "Schema-driven validator for KDataForge packs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "KMods" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pyinstaller>=6.12,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
kdataforge-linter = "kdataforge_linter.cli:main"
kdataforge-linter-gui = "kdataforge_linter.gui:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kdataforge_linter"]

[tool.hatch.build]
include = [
  "src/kdataforge_linter/**/*.py",
  "src/kdataforge_linter/schemas/*.yml",
  "src/kdataforge_linter/catalogs/*.json",
  "src/kdataforge_linter/resources/*.png",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/kdataforge_linter/legacy.py" = ["E501", "F401", "F841", "UP035"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kdataforge_linter"]
