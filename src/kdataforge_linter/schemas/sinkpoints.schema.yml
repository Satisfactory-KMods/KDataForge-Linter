$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/sinkpoints.schema.yml
x-kdf-type: sinkpoints
title: KDataForge sink points
allOf:
  - $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/documentBase
  - type: object
    required: [entries]
    properties:
      type: { const: sinkpoints }
      track: { enum: [Default, Exploration], default: Default }
      entries:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [item, points]
          properties:
            item:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/nonEmptyString
            points: { type: integer }
            overridden: { type: integer }
unevaluatedProperties: false

