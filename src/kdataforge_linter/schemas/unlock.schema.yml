$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kmods.dev/kdataforge-linter/schemas/unlock.schema.yml
x-kdf-type: unlock
title: KDataForge unlock classes
allOf:
  - $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/documentBase
  - type: object
    required: [unlocks]
    properties:
      type: { const: unlock }
      unlocks:
        type: array
        minItems: 1
        items:
          allOf:
            - $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/generatedEntry
            - if:
                required: [id]
              then:
                required: [parent]
unevaluatedProperties: false

