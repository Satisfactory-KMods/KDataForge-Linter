$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kmods.dev/kdataforge-linter/schemas/cdo.schema.yml
x-kdf-type: cdo
title: KDataForge CDO patches
allOf:
  - $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/documentBase
  - type: object
    required: [patches]
    properties:
      type: { const: cdo }
      patches:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [properties]
          properties:
            target:
              $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/stringOrList
            allAssetsOfClass:
              $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/nonEmptyString
            matchTag:
              $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/stringOrList
            ofClass:
              $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/nonEmptyString
            tagProperty:
              $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/nonEmptyString
            matchAssets: { type: boolean, default: true }
            applyToSubclasses: { type: boolean, default: false }
            applyToSpawnedActors: { type: boolean, default: false }
            propagateToInstances: { type: boolean, default: true }
            deferOneGameTick: { type: boolean, default: false }
            properties:
              $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/properties
          oneOf:
            - required: [target]
            - required: [allAssetsOfClass]
            - required: [matchTag, ofClass]
unevaluatedProperties: false

