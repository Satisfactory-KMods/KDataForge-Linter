$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml
title: KDataForge shared schema definitions
$defs:
  nonEmptyString:
    type: string
    minLength: 1
  token:
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9_.-]*$
  stringOrList:
    oneOf:
      - $ref: '#/$defs/nonEmptyString'
      - type: array
        minItems: 1
        items:
          $ref: '#/$defs/nonEmptyString'
  # One `where:` filter clause: a property path (may contain `[*]`) plus exactly one operator.
  whereClause:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path:
        $ref: '#/$defs/nonEmptyString'
      equals: {}
      notEquals: {}
      lessThan: { type: number }
      lessOrEqual: { type: number }
      greaterThan: { type: number }
      greaterOrEqual: { type: number }
      contains: {}
      notContains: {}
      in:
        oneOf:
          - $ref: '#/$defs/nonEmptyString'
          - type: number
          - type: boolean
          - type: array
            minItems: 1
      notIn:
        oneOf:
          - $ref: '#/$defs/nonEmptyString'
          - type: number
          - type: boolean
          - type: array
            minItems: 1
      matches:
        $ref: '#/$defs/nonEmptyString'
      isEmpty: { type: boolean }
    oneOf:
      - required: [equals]
      - required: [notEquals]
      - required: [lessThan]
      - required: [lessOrEqual]
      - required: [greaterThan]
      - required: [greaterOrEqual]
      - required: [contains]
      - required: [notContains]
      - required: [in]
      - required: [notIn]
      - required: [matches]
      - required: [isEmpty]
  # The scope-filter keys every selecting document type shares (cdo patches, remove: entries,
  # sublevel block: entries, sinkpoints entries). Whether ofClass is required depends on the
  # document type — see scopeNeedsOfClass.
  scopeFilters:
    type: object
    properties:
      ofClass:
        $ref: '#/$defs/nonEmptyString'
      matchTag:
        $ref: '#/$defs/stringOrList'
      tagProperty:
        $ref: '#/$defs/nonEmptyString'
      matchAssets: { type: boolean, default: true }
      matchName:
        $ref: '#/$defs/stringOrList'
      producedIn:
        $ref: '#/$defs/stringOrList'
      ingredient:
        $ref: '#/$defs/stringOrList'
      product:
        $ref: '#/$defs/stringOrList'
      where:
        oneOf:
          - $ref: '#/$defs/whereClause'
          - type: array
            minItems: 1
            items:
              $ref: '#/$defs/whereClause'
  # For types WITHOUT a default scope (cdo patches, sublevel block entries): matchTag / matchName /
  # where need an explicit ofClass, or a recipe shortcut (producedIn / ingredient / product →
  # FGRecipe). remove: entries, resourcenode entries and sinkpoints entries default the scope to
  # their own base class and do not reference this rule.
  scopeNeedsOfClass:
    if:
      anyOf:
        - required: [matchTag]
        - required: [matchName]
        - required: [where]
    then:
      anyOf:
        - required: [ofClass]
        - required: [producedIn]
        - required: [ingredient]
        - required: [product]
  hasScopeFilter:
    anyOf:
      - required: [matchTag]
      - required: [matchName]
      - required: [where]
      - required: [producedIn]
      - required: [ingredient]
      - required: [product]
  # `remove:` entry of recipe / schematic / research documents: one class reference, or a filter
  # map selecting every class of the type that passes.
  contentRemoval:
    type: array
    minItems: 1
    items:
      oneOf:
        - $ref: '#/$defs/nonEmptyString'
        - allOf:
            - $ref: '#/$defs/scopeFilters'
            - $ref: '#/$defs/hasScopeFilter'
          unevaluatedProperties: false
  schemaReference:
    $ref: '#/$defs/nonEmptyString'
  conditionBehavior:
    type: string
    pattern: '^(?:[Aa][Nn][Dd]|[Oo][Rr])$'
  conditionObject:
    type: object
    additionalProperties: false
    properties:
      gameVersion:
        $ref: '#/$defs/nonEmptyString'
      hasMod:
        $ref: '#/$defs/stringOrList'
      modVersion:
        type: object
        minProperties: 1
        additionalProperties:
          $ref: '#/$defs/nonEmptyString'
      hasClass:
        $ref: '#/$defs/stringOrList'
      ifNotMatch:
        type: boolean
        default: false
  conditions:
    if:
      type: array
    then:
      items:
        $ref: '#/$defs/conditionObject'
    else:
      $ref: '#/$defs/conditionObject'
  documentBase:
    type: object
    properties:
      $schema:
        $ref: '#/$defs/schemaReference'
      type:
        $ref: '#/$defs/nonEmptyString'
      debug:
        type: boolean
      conditionBehaivor:
        $ref: '#/$defs/conditionBehavior'
      conditionBehavior:
        $ref: '#/$defs/conditionBehavior'
      conditions:
        $ref: '#/$defs/conditions'
      include:
        $ref: '#/$defs/stringOrList'
  propertyPath:
    type: string
    pattern: '^[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*|\[(?:\d+|[A-Za-z0-9_ -]+|"[^"]+")\])*$'
  operation:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path:
        $ref: '#/$defs/propertyPath'
      op:
        enum:
          - add
          - append
          - clamp
          - clear
          - copy
          - divide
          - duplicate
          - insert
          - max
          - min
          - move
          - multiply
          - prepend
          - remove
          - remove_at
          - replace
          - reverse
          - set
          - sort
          - subtract
          - swap
          - unique
      value: {}
      min:
        type: number
      max:
        type: number
      index:
        type: integer
      with:
        type: integer
      from:
        $ref: '#/$defs/propertyPath'
  properties:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/operation'
  generatedEntry:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id:
        $ref: '#/$defs/token'
      parent:
        $ref: '#/$defs/nonEmptyString'
      register:
        type: boolean
      properties:
        $ref: '#/$defs/properties'
  registerableEntry:
    type: object
    additionalProperties: false
    properties:
      id:
        $ref: '#/$defs/token'
      class:
        $ref: '#/$defs/nonEmptyString'
      parent:
        $ref: '#/$defs/nonEmptyString'
      register:
        type: boolean
      properties:
        $ref: '#/$defs/properties'
    oneOf:
      - required: [id]
        not:
          required: [class]
      - required: [class]
        not:
          required: [id]
  instancedObject:
    type: object
    additionalProperties: false
    required: [class]
    properties:
      class:
        $ref: '#/$defs/nonEmptyString'
      properties:
        $ref: '#/$defs/properties'
  coordinate:
    type: object
    additionalProperties: false
    required: [X, Y]
    properties:
      X:
        type: integer
      Y:
        type: integer
  nodeReference:
    oneOf:
      - $ref: '#/$defs/coordinate'
      - type: object
        additionalProperties: false
        required: [schematic]
        properties:
          schematic:
            $ref: '#/$defs/nonEmptyString'
  road:
    type: object
    additionalProperties: false
    required: [key, points]
    properties:
      key:
        $ref: '#/$defs/nodeReference'
      points:
        type: array
        minItems: 2
        items:
          $ref: '#/$defs/coordinate'
  researchNode:
    type: object
    additionalProperties: false
    required: [schematic]
    properties:
      schematic:
        $ref: '#/$defs/nonEmptyString'
      class:
        $ref: '#/$defs/nonEmptyString'
      coordinate:
        $ref: '#/$defs/coordinate'
      parents:
        type: array
        items:
          $ref: '#/$defs/nodeReference'
      nodesToUnhide:
        type: array
        items:
          $ref: '#/$defs/nodeReference'
      unhiddenBy:
        type: array
        items:
          $ref: '#/$defs/nodeReference'
      childrenAndRoads:
        oneOf:
          - $ref: '#/$defs/road'
          - type: array
            minItems: 1
            items:
              $ref: '#/$defs/road'
      properties:
        $ref: '#/$defs/properties'
  numberOrVector:
    oneOf:
      - type: number
      - type: array
        minItems: 3
        maxItems: 3
        items:
          type: number
      - type: object
        additionalProperties: false
        required: [X, Y, Z]
        properties:
          X: { type: number }
          Y: { type: number }
          Z: { type: number }
  sublevelBlockEntry:
    oneOf:
      - $ref: '#/$defs/nonEmptyString'
      - type: object
        allOf:
          - $ref: '#/$defs/scopeFilters'
          - $ref: '#/$defs/scopeNeedsOfClass'
        properties:
          target:
            $ref: '#/$defs/stringOrList'
          allAssetsOfClass:
            $ref: '#/$defs/nonEmptyString'
        anyOf:
          - required: [target]
          - required: [allAssetsOfClass]
          - $ref: '#/$defs/hasScopeFilter'
        unevaluatedProperties: false
  resourceNodeType:
    type: string
    pattern: '^(?:EResourceNodeType::)?(?:Node|FrackingSatellite|FrackingCore|Geyser|Deposit)$'
  resourceNodeRemoval:
    oneOf:
      - $ref: '#/$defs/nonEmptyString'
      - type: object
        allOf:
          - $ref: '#/$defs/scopeFilters'
        anyOf:
          - required: [resource]
          - $ref: '#/$defs/hasScopeFilter'
        properties:
          resource:
            $ref: '#/$defs/nonEmptyString'
          nodeTypes:
            type: array
            items:
              $ref: '#/$defs/resourceNodeType'
          allowOccupied:
            type: boolean
            default: false
          removeFromScanner:
            type: boolean
            default: true
        unevaluatedProperties: false
