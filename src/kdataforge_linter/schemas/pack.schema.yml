$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kmods.dev/kdataforge-linter/schemas/pack.schema.yml
x-kdf-type: pack
title: KDataForge pack manifest
type: object
additionalProperties: false
required: [ref, name, version, contributer]
properties:
  ref:
    $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/token
  name:
    $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/nonEmptyString
  version:
    type: string
    pattern: '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$'
  contributer:
    oneOf:
      - $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/token
      - type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/token
  priority:
    type: integer
    default: 100
  enabled:
    type: boolean
    default: true
  debug:
    type: boolean
    default: false
  conditions:
    $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/conditions
  dependencies:
    type: array
    uniqueItems: true
    items:
      $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/token
  redirects:
    type: object
    additionalProperties:
      $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/token

