$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kmods.dev/kdataforge-linter/schemas/asset.schema.yml
x-kdf-type: asset
title: KDataForge image assets
allOf:
  - $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/documentBase
  - type: object
    required: [assets]
    properties:
      type: { const: asset }
      assets:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [id, file]
          properties:
            id:
              $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/token
            file:
              type: string
              minLength: 1
              pattern: '(?i)\.(png|jpe?g|tga|bmp)$'
            properties:
              $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/properties
unevaluatedProperties: false

