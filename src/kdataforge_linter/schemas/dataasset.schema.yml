$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kmods.dev/kdataforge-linter/schemas/dataasset.schema.yml
x-kdf-type: dataasset
title: KDataForge primary data assets
allOf:
  - $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/documentBase
  - type: object
    required: [assets]
    properties:
      type: { const: dataasset }
      assets:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [id, class]
          properties:
            id:
              $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/token
            class:
              $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/nonEmptyString
            properties:
              $ref: https://kmods.dev/kdataforge-linter/schemas/common.schema.yml#/$defs/properties
unevaluatedProperties: false

