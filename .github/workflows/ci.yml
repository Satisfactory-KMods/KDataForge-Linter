name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --extra gui --group dev --locked
      - run: uv run ruff check .
      - run: uv run pytest --cov=kdataforge_linter --cov-report=term-missing
      - run: uv run kdataforge-linter schemas check

